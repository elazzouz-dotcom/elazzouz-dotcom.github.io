function layout(title,desc,body){document.querySelector('#app').innerHTML=`<section class="hero"><span class="eyebrow">Local-first workspace</span><h1>${title}</h1><p>${desc}</p></section>${body}`}
function home(){layout('Tools that help you finish the task.','Use focused browser utilities for code, data, automation planning, API inspection, and safe local transformations. No filler directories—just working interfaces and generators.',`<h2>Three useful workspaces.</h2><div class="grid"><a class="card" href="/tools"><span class="tag">Build and test</span><h3>Developer toolkit</h3><p>Run local playgrounds and practical utilities.</p></a><a class="card" href="/tools"><span class="tag">Browser workflows</span><h3>Browser workflow studio</h3><p>Arrange browser steps and generate reviewed starters.</p></a><a class="card" href="/tools"><span class="tag">API utilities</span><h3>API workbench</h3><p>Inspect supported API requests while keeping credentials local.</p></a><a class="card" href="/github-studios"><span class="tag">GitHub integration</span><h3>GitHub Studios</h3><p>افتح جميع المستودعات والاستوديوهات مباشرةً من مصدرها على GitHub.</p></a></div>`)}
function toolsPage(){layout('Choose a tool that does something useful.','Every card below opens an interactive tool or a local code generator. Search by task, language, or output.',`<p><b>${tools.length} working tools available.</b></p><div class="toolbar"><input id="search" placeholder="Search tools..."></div><div class="tools" id="tools">${tools.map(([n,d])=>`<article class="tool"><b>${n}</b><small>${d}</small></article>`).join('')}</div>`);document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))} }
function githubStudios(){layout('GitHub Studios','اربط جميع الاستوديوهات والمشاريع مباشرةً بمصدرها على GitHub. الموقع يفتح المستودع الأصلي ولا ينسخ الكود أو يخزن مفاتيح الدخول.',`<div class="toolbar"><input id="repoSearch" placeholder="ابحث في المستودعات..."></div><div class="tools" id="repos">${githubRepos.map(r=>`<a class="tool" href="${r.url}" target="_blank" rel="noreferrer"><b>${r.name} ${r.private?'· خاص':''}</b><small>${r.description||'مستودع GitHub مباشر'}</small></a>`).join('')}</div><p>عدد الاستوديوهات المرتبطة: <b>${githubRepos.length}</b>. المستودعات الخاصة تظل محمية بصلاحيات GitHub.</p>`);document.querySelector('#repoSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#repos .tool').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}}

function hosting(){layout('Prepare the site for this conversation to be hosted.','Review your website pages and files before publishing, and use the checklist to prepare for hosting.',`<div class="card"><span class="tag">Publishing preparation space</span><h3>Check the site's readiness</h3><p>Project: static HTML pages with shared CSS and JavaScript files.</p><p>Pre-publication list: 0 out of 6 steps completed.</p><p>Your publishing notes remain local to this browser.</p></div>`)}
const path=location.pathname.replace(/\/$/,'')||'/';if(path==='/tools')toolsPage();else if(path==='/chat-studio')chat();else if(path==='/hosting-studio')hosting();else if(path==='/github-studios')githubStudios();else home();
