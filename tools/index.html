const languageOptions=Object.entries(siteTranslations).map(([code,v])=>`<option value="${code}">${v.name}</option>`).join('');
const languageSelect=document.createElement('select');languageSelect.id='language-select';languageSelect.setAttribute('aria-label','Language');languageSelect.innerHTML=languageOptions;languageSelect.style.cssText='background:#111923;color:#e6edf3;border:1px solid #263445;border-radius:10px;padding:9px 10px;max-width:150px;';
document.querySelector('.nav').appendChild(languageSelect);
function translateText(root,dict){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{let value=node.nodeValue;for(const [from,to] of Object.entries(dict)){if(value.trim()===from) value=value.replace(from,to);}node.nodeValue=value;});root.querySelectorAll('input[placeholder]').forEach(input=>{if(dict[input.placeholder])input.placeholder=dict[input.placeholder];});}
function applyLanguage(code){const lang=siteTranslations[code]||siteTranslations.en;document.documentElement.lang=code;document.documentElement.dir=code==='ar'||code==='ur'?'rtl':'ltr';translateText(document.body,lang);languageSelect.value=code;localStorage.setItem('site-language',code);}
languageSelect.addEventListener('change',()=>{localStorage.setItem('site-language',languageSelect.value);location.reload();});
const savedLanguage=localStorage.getItem('site-language')||'en';languageSelect.value=savedLanguage;applyLanguage(savedLanguage);
