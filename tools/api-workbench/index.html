<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Workbench</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b1020; color: #e2e8f0; }
    .panel { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.2); }
    .mono { font-family: 'Courier New', monospace; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800 bg-slate-950/90">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4 lg:px-8">
      <a href="/" class="text-xl font-black text-white">API Workbench</a>
      <nav class="hidden gap-5 text-sm font-semibold text-slate-300 md:flex">
        <a href="/workspaces/">الأدوات</a>
        <a href="/">الرئيسية</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-12 lg:px-8">
    <section class="mb-10 rounded-2xl border border-slate-800 bg-gradient-to-r from-slate-900 to-blue-900/20 p-8">
      <h1 class="text-4xl font-black">مقعد عمل API</h1>
      <p class="mt-3 max-w-3xl text-lg text-slate-300">فحص طلبات API مدعومة من المتصفح مع حفظ بيانات الاعتماد محليًا فقط.</p>
    </section>

    <div class="grid gap-6 lg:grid-cols-2">
      <div class="panel rounded-2xl p-6">
        <h2 class="mb-4 text-2xl font-bold text-cyan-300">⌁ إعداد الطلب</h2>
        
        <div class="space-y-3">
          <div>
            <label class="mb-2 block text-sm font-bold">الطريقة</label>
            <select id="method" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>DELETE</option>
              <option>PATCH</option>
            </select>
          </div>

          <div>
            <label class="mb-2 block text-sm font-bold">الرابط</label>
            <input id="url" type="text" placeholder="https://api.example.com/endpoint" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2">
          </div>

          <div>
            <label class="mb-2 block text-sm font-bold">Headers (JSON)</label>
            <textarea id="headers" class="mono w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm" rows="3" placeholder='{"Content-Type": "application/json"}'></textarea>
          </div>

          <div>
            <label class="mb-2 block text-sm font-bold">Body (JSON)</label>
            <textarea id="body" class="mono w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm" rows="4" placeholder='{"key": "value"}'></textarea>
          </div>

          <button onclick="sendRequest()" class="w-full rounded-lg bg-cyan-500 px-4 py-3 font-bold text-slate-950">أرسل الطلب</button>
        </div>
      </div>

      <div class="panel rounded-2xl p-6">
        <h2 class="mb-4 text-2xl font-bold text-cyan-300">📋 الاستجابة</h2>
        <div>
          <p class="mb-2 text-sm text-slate-400">الحالة: <span id="status-code" class="font-bold text-cyan-300">-</span></p>
          <pre id="response" class="mono overflow-auto rounded-lg border border-slate-700 bg-slate-950 p-4 text-xs text-cyan-300" style="height: 300px;">// الاستجابة ستظهر هنا</pre>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-sm text-slate-400 mt-12">
    <p>© 2026 elazzouz-dotcom - بيانات الاعتماد تبقى محليًا</p>
  </footer>

  <script>
    async function sendRequest() {
      try {
        const method = document.getElementById('method').value;
        const url = document.getElementById('url').value;
        const headers = JSON.parse(document.getElementById('headers').value || '{}');
        const body = document.getElementById('body').value;

        const options = { method, headers };
        if (body && (method === 'POST' || method === 'PUT' || method === 'PATCH')) {
          options.body = body;
        }

        const response = await fetch(url, options);
        const text = await response.text();

        document.getElementById('status-code').textContent = response.status + ' ' + response.statusText;
        document.getElementById('response').textContent = text;
      } catch (error) {
        document.getElementById('response').textContent = 'خطأ: ' + error.message;
      }
    }
  </script>
</body>
</html>
