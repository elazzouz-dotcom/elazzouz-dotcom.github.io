<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b141a"><title>بحث وتصنيف الأيقونات | Platform Suite</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141a;color:#e9edef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding:16px 10px 30px}.shell{max-width:760px;margin:auto}.top{display:flex;gap:10px;align-items:center;background:#202c33;border:1px solid #2a3942;border-radius:16px;padding:12px;margin-bottom:10px}.top b{flex:1;font-size:16px}.top span{display:block;color:#8696a0;font-size:11px;margin-top:3px}.top a{color:#8fd7c4;text-decoration:none;font-size:11px}.panel{background:#111b21;border:1px solid #2a3942;border-radius:16px;padding:12px;margin-bottom:10px}.search{display:flex;gap:7px}.search input{flex:1;background:#0f1a20;border:1px solid #2a3942;border-radius:10px;color:#e9edef;padding:11px;font:inherit;outline:none}.search input:focus{border-color:#00a884}.btn{border:0;border-radius:10px;padding:9px 11px;background:#00a884;color:#04241c;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.btn.secondary{background:#2a3942;color:#d8e8ec}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{border:1px solid #2a4248;background:#1b2b31;color:#a9c0c5;border-radius:14px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer}.chip.on{background:#00a884;border-color:#00a884;color:#04241c;font-weight:700}.hint{color:#8696a0;font-size:11px;line-height:1.6;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#16242a;border:1px solid #24373e;border-radius:10px;text-align:center;padding:9px}.stat b{display:block;font-size:19px;color:#8fd7c4}.stat span{font-size:10.5px;color:#7e969e}.results{display:flex;flex-direction:column;gap:7px;margin-top:10px}.result{display:flex;gap:9px;align-items:center;background:#17262d;border:1px solid #22343b;border-radius:10px;padding:9px}.result b{font-size:12.5px;flex:1}.result small{display:block;color:#82979f;font-size:10.5px;margin-top:3px}.badge{background:#203b3c;color:#8fd7c4;border-radius:9px;padding:4px 7px;font-size:10px;white-space:nowrap}.empty{text-align:center;color:#81979f;font-size:12px;padding:22px}.file{display:none}.notice{color:#d9a441;font-size:11px;margin-top:7px}.footer{text-align:center;color:#71858d;font-size:11px;margin-top:12px}.footer a{color:#8fd7c4}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><b>بحث وتصنيف الأيقونات</b><span>بحث تلقائي حسب الاسم والوصف مع تصنيف ذكي</span></div><a href="../?locale=ar">المنصة</a></header>
<section class="panel">
  <div class="search"><input id="query" placeholder="قلب بحال: coin أو play أو selected" autocomplete="off"><button class="btn" id="searchBtn">بحث</button></div>
  <div class="toolbar" id="categories"></div>
  <div class="toolbar"><button class="btn secondary" id="loadBtn">رفع manifest.json</button><input class="file" id="fileInput" type="file" accept="application/json,.json"><button class="btn secondary" id="exportBtn">تصدير التصنيف JSON</button></div>
  <div class="hint">يمكنك البحث فالاسم أو الوصف، أو رفع manifest كامل. الصفحة كتخدم مباشرة حتى بلا ملف باستعمال أمثلة الأيقونات الموجودة.</div><div class="notice" id="notice"></div>
</section>
<section class="panel"><div class="stats"><div class="stat"><b id="total">0</b><span>كل الأيقونات</span></div><div class="stat"><b id="shown">0</b><span>النتائج</span></div><div class="stat"><b id="groups">0</b><span>الفئات</span></div></div><div class="results" id="results"></div></section>
<div class="footer"><a href="../?locale=ar">العودة إلى Platform Suite</a></div>
</main>
<script>
const CATEGORIES={checkbox:['checkbox'],check:['check'],timer:['timer'],time:['time','clock','history','calendar','reset'],money:['coin','money','wallet','gift'],reward:['trophy','medal','star','target','flag'],media:['play','pause'],alert:['bell']};
const DEFAULT_ICONS=[
{name:'CheckIcon',use_for:['confirm','selected','verified']},{name:'CheckboxEmptyIcon',use_for:['multi-select','form checkbox']},{name:'CheckboxInIcon',use_for:['multi-select','form checkbox']},{name:'HistoryIcon',use_for:['navigation related action']},{name:'PauseIcon',use_for:['pause playback','pause process']},{name:'PlayIcon',use_for:['media related action']}
];
let icons=DEFAULT_ICONS.slice(), activeCategory='all', lastResults=[];
const $=id=>document.getElementById(id);
function tokenize(name){return String(name||'').match(/[A-Z][a-z]*|[a-z]+|\d+/g)?.map(x=>x.toLowerCase())||[]}
function getCategory(name){const tokens=tokenize(name);for(const [cat,words] of Object.entries(CATEGORIES)){if(words.some(word=>tokens.includes(word)))return cat}return'other'}
function getCategories(name){const tokens=tokenize(name),found=[];for(const [cat,words] of Object.entries(CATEGORIES)){if(words.some(word=>tokens.includes(word)))found.push(cat)}return found.length?found:['other']}
function normalized(icon){const name=String(icon.name||'');const use=Array.isArray(icon.use_for)?icon.use_for:[String(icon.use_for||'')].filter(Boolean);return{name,category:getCategory(name),categories:getCategories(name),use_for:use,file:icon.file}}
function searchIcons(query){const q=String(query||'').trim().toLowerCase();return icons.map(normalized).filter(item=>(activeCategory==='all'||item.category===activeCategory)&&(!q||item.name.toLowerCase().includes(q)||tokenize(item.name).includes(q)||item.use_for.join(' ').toLowerCase().includes(q)))}
function groups(){return [...new Set(icons.map(x=>getCategory(x.name)))].sort()}
function renderCategories(){const cats=groups();$('categories').innerHTML='<button class="chip '+(activeCategory==='all'?'on':'')+'" data-cat="all">الكل</button>'+cats.map(cat=>`<button class="chip ${activeCategory===cat?'on':''}" data-cat="${cat}">${cat}</button>`).join('');$('categories').querySelectorAll('[data-cat]').forEach(btn=>btn.onclick=()=>{activeCategory=btn.dataset.cat;renderCategories();render()})}
function render(){lastResults=searchIcons($('query').value);$('total').textContent=icons.length;$('shown').textContent=lastResults.length;$('groups').textContent=groups().length;$('results').innerHTML=lastResults.length?lastResults.map(item=>`<article class="result"><div><b>${escapeHtml(item.name)}</b><small>${escapeHtml(item.use_for.join(' · ')||'بدون وصف')}</small></div><span class="badge">${item.category}</span></article>`).join(''):'<div class="empty">ما لقا حتى نتيجة. جرّب كلمة أخرى أو الفئة «الكل».</div>'}
function escapeHtml(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function classify(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.icons))return data.icons;throw new Error('manifest خاصو يكون لائحة أو object فيه icons')}
$('searchBtn').onclick=render;$('query').oninput=render;$('query').onkeydown=e=>{if(e.key==='Enter')render()};$('loadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());const loaded=classify(data).filter(x=>x&&x.name);icons=loaded;activeCategory='all';$('notice').textContent=`تم تحميل ${icons.length} أيقونة من الملف.`;renderCategories();render()}catch(err){$('notice').textContent='تعذر قراءة manifest.json: '+err.message}e.target.value=''};$('exportBtn').onclick=()=>{const grouped={};for(const item of icons.map(normalized)){(grouped[item.category]??=[]).push(item)}const blob=new Blob([JSON.stringify(grouped,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='icons-grouped.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};renderCategories();render();
</script>
</body>
</html>
