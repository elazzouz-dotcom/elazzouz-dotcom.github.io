<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Azzouz Bridge Lab — محاكاة تفاعلية لجسور وشبكات برمجية ضخمة.">
  <title>Azzouz Bridge Lab · جسور برمجية ضخمة</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: Consolas, "Courier New", monospace; overflow: hidden; }
    #hud { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,.92); padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; z-index: 10; border-bottom: 1px solid #00ff88; }
    .brand { color: #00ff88; font-weight: 800; margin-inline-end: 8px; }
    .chip { border: 1px solid #222; padding: 4px 10px; border-radius: 8px; font-size: 11px; min-width: 90px; text-align: center; }
    .chip b { display: block; color: #00ff88; font-size: 14px; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #log { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; overflow: auto; background: rgba(0,0,0,.9); font-size: 11px; padding: 5px; z-index: 5; }
    button { background: #00ff88; color: #00150b; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: bold; }
    button:hover { background: #7dffbd; }
    @media (max-width: 700px) { .brand { flex-basis: 100%; } .chip { min-width: 72px; } button { flex: 1; } }
  </style>
</head>
<body>
  <div id="hud" aria-label="لوحة تحكم مختبر الجسور">
    <span class="brand">Azzouz Bridge Lab · جسور برمجية ضخمة</span>
    <div class="chip">الحشرات<b id="c">57</b></div>
    <div class="chip">الجسور<b id="b">0</b></div>
    <div class="chip">طول الجسر<b id="l">0</b></div>
    <div class="chip">التكامل<b id="t">0%</b></div>
    <div class="chip">القوة<b id="s">0</b></div>
    <button type="button" onclick="buildMegaBridge()">ابنِ جسرًا ضخمًا</button>
    <button type="button" onclick="buildTower()">ابنِ برجًا</button>
    <button type="button" onclick="buildNetwork()">ابنِ شبكة</button>
  </div>
  <canvas id="cv" aria-label="محاكاة الجسور البرمجية"></canvas>
  <div id="log" aria-live="polite"></div>
  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function resize() { cv.width = innerWidth; cv.height = innerHeight; }
    resize();
    addEventListener('resize', resize);
    function log(message) {
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString('ar')}] ${message}`;
      const output = document.getElementById('log');
      output.appendChild(entry);
      while (output.children.length > 50) output.removeChild(output.firstChild);
      output.scrollTop = output.scrollHeight;
    }

    let colony = [], bridges = [], nextId = 0, towerHeight = 0;
    const roles = ['استكشاف', 'فحص', 'حماية', 'نور', 'ميزان', 'بناء'];

    class BridgeInsect {
      constructor(role, parent = null) {
        if (!role) {
          const counts = Object.fromEntries(roles.map((item) => [item, 0]));
          colony.forEach((item) => counts[item.role]++);
          role = roles.reduce((a, b) => counts[a] < counts[b] ? a : b);
        }
        this.role = role;
        this.id = ++nextId;
        this.gen = parent ? parent.gen + 1 : 1;
        this.energy = 100 + Math.random() * 20;
        this.eff = parent ? Math.max(.6, Math.min(2.4, parent.eff + (Math.random() - .5) * .1)) : 1 + Math.random() * .3;
        this.x = parent ? parent.x + (Math.random() - .5) * 20 : Math.random() * cv.width;
        this.y = parent ? parent.y + (Math.random() - .5) * 20 : Math.random() * cv.height;
        this.vx = (Math.random() - .5) * 1.5;
        this.vy = (Math.random() - .5) * 1.5;
        this.age = 0;
        this.partner = null;
        this.bridgeId = null;
        this.isInBridge = false;
        this.network = [];
        this.strengths = this.getStrengths();
        this.weakness = this.getWeakness();
      }
      getStrengths() {
        return { 'استكشاف': ['بحث', 'سرعة', 'اكتشاف'], 'فحص': ['تحليل', 'تدقيق', 'قراءة كود'], 'حماية': ['أمان', 'تشفير', 'صد'], 'نور': ['طاقة', 'إضاءة', 'حياة'], 'ميزان': ['توازن', 'عدل', 'قياس'], 'بناء': ['بناء', 'ربط', 'جسر'] }[this.role];
      }
      getWeakness() {
        return { 'استكشاف': 'يحتاج حماية', 'فحص': 'يحتاج سرعة', 'حماية': 'يحتاج نور', 'نور': 'يحتاج ميزان', 'ميزان': 'يحتاج بناء', 'بناء': 'يحتاج استكشاف' }[this.role];
      }
      findComplement() {
        const needed = { 'استكشاف': 'حماية', 'فحص': 'استكشاف', 'حماية': 'نور', 'نور': 'ميزان', 'ميزان': 'بناء', 'بناء': 'فحص' }[this.role];
        return colony.filter((item) => item !== this && item.role === needed && !item.isInBridge && !item.partner).sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y))[0] || null;
      }
      update() {
        this.age++;
        this.energy -= .12;
        if (!this.partner && !this.isInBridge) {
          const complement = this.findComplement();
          if (complement) {
            this.partner = complement;
            complement.partner = this;
            log(`تكامل: #${this.id} (${this.role}) + #${complement.id} (${complement.role}) · ${this.weakness} + ${complement.strengths[0]}`);
            if (colony.length < 300 && Math.random() < .5) {
              const child = new BridgeInsect('بناء', this);
              child.x = (this.x + complement.x) / 2;
              child.y = (this.y + complement.y) / 2;
              colony.push(child);
            }
          }
        }
        if (this.partner && !this.isInBridge) {
          this.x += (this.partner.x - this.x) * .02;
          this.y += (this.partner.y - this.y) * .02;
        } else if (!this.isInBridge) {
          this.x += this.vx; this.y += this.vy;
          this.vx += (Math.random() - .5) * .15; this.vy += (Math.random() - .5) * .15;
          if (this.x < 0 || this.x > cv.width) this.vx *= -1;
          if (this.y < 0 || this.y > cv.height) this.vy *= -1;
        }
        if (this.energy > 115 && colony.length < 300 && Math.random() < .015) { this.energy -= 30; colony.push(new BridgeInsect(null, this)); }
        return this.energy > 0;
      }
    }

    class MegaBridge {
      constructor(type) {
        this.id = bridges.length + 1; this.type = type; this.segments = []; this.strength = 0; this.length = 0;
        this.startX = Math.random() * 200 + 50; this.startY = innerHeight * .6;
        this.endX = innerWidth - Math.random() * 200 - 50; this.endY = innerHeight * .6;
      }
      build() {
        const available = colony.filter((item) => !item.isInBridge).slice(0, 30);
        if (available.length < 10) { log('لا توجد حشرات كافية للجسر؛ سيستمر السرب في التكاثر.'); return false; }
        const steps = Math.min(available.length, 30);
        for (let i = 0; i < steps; i++) {
          const insect = available[i], ratio = steps === 1 ? 0 : i / (steps - 1);
          insect.isInBridge = true; insect.bridgeId = this.id;
          insect.x = this.startX + (this.endX - this.startX) * ratio;
          insect.y = this.startY - Math.sin(ratio * Math.PI) * 40 + (Math.random() - .5) * 8;
          insect.vx = 0; insect.vy = 0; this.segments.push(insect);
          this.strength += insect.eff * 10; this.length++;
        }
        bridges.push(this);
        log(`الجسر الضخم #${this.id} بُني · ${this.length} حشرة · القوة ${this.strength.toFixed(0)}`);
        for (let i = 0; i < 5 && colony.length < 300; i++) colony.push(new BridgeInsect(null));
        return true;
      }
    }

    function buildMegaBridge() { new MegaBridge('الواجهة ↔ الخادم · Frontend ↔ Backend').build(); }
    function buildTower() {
      const available = colony.filter((item) => !item.isInBridge).slice(0, 19), x = innerWidth / 2, y = innerHeight - 80;
      available.forEach((insect, index) => { insect.isInBridge = true; insect.x = x + (Math.random() - .5) * 10; insect.y = y - index * 14; insect.vx = 0; insect.vy = 0; });
      towerHeight += available.length;
      log(`برج التوحيد · ${available.length} حشرة · الارتفاع ${towerHeight}`);
    }
    function buildNetwork() {
      let count = 0;
      colony.forEach((insect) => { const others = colony.filter((item) => item !== insect).slice(0, 3); others.forEach((other) => { if (!insect.network.includes(other.id)) { insect.network.push(other.id); count++; } }); });
      log(`الشبكة بُنيت · ${count} روابط · كل حشرة مرتبطة بما يصل إلى 3 حشرات`);
    }

    for (let i = 0; i < 57; i++) colony.push(new BridgeInsect(roles[i % roles.length]));
    log('Azzouz Bridge Lab بدأ · 57 حشرة · 6 أدوار · التكامل يبني الجسر');

    function loop() {
      colony = colony.filter((insect) => insect.update());
      while (colony.length < 40) colony.push(new BridgeInsect(null));
      const paired = colony.filter((insect) => insect.partner).length;
      document.getElementById('c').textContent = colony.length;
      document.getElementById('b').textContent = bridges.length;
      document.getElementById('l').textContent = bridges.reduce((sum, bridge) => sum + bridge.length, 0);
      document.getElementById('t').textContent = `${(colony.length ? paired / colony.length * 100 : 0).toFixed(0)}%`;
      document.getElementById('s').textContent = bridges.reduce((sum, bridge) => sum + bridge.strength, 0).toFixed(0);
    }
    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, cv.width, cv.height);
      bridges.forEach((bridge) => {
        ctx.strokeStyle = 'rgba(0,255,136,.7)'; ctx.lineWidth = 3; ctx.beginPath();
        bridge.segments.forEach((segment, index) => index ? ctx.lineTo(segment.x, segment.y) : ctx.moveTo(segment.x, segment.y)); ctx.stroke();
        bridge.segments.forEach((segment) => { ctx.strokeStyle = 'rgba(0,255,136,.2)'; ctx.beginPath(); ctx.moveTo(segment.x, segment.y); ctx.lineTo(segment.x, innerHeight * .75); ctx.stroke(); });
      });
      colony.forEach((insect) => {
        if (insect.partner) { ctx.strokeStyle = 'rgba(255,170,0,.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(insect.x, insect.y); ctx.lineTo(insect.partner.x, insect.partner.y); ctx.stroke(); }
        const color = { 'استكشاف': '#00ff88', 'فحص': '#ffaa00', 'حماية': '#4488ff', 'نور': '#ffff88', 'ميزان': '#ff44ff', 'بناء': '#00ccff' }[insect.role];
        const radius = insect.isInBridge ? 4 : 2.5 + insect.eff;
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = insect.isInBridge ? 10 : 5; ctx.beginPath(); ctx.arc(insect.x, insect.y, radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        if (insect.partner) { ctx.strokeStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(insect.x, insect.y, radius + 2, 0, Math.PI * 2); ctx.stroke(); }
      });
    }
    setInterval(loop, 40); setInterval(draw, 16);
  </script>
</body>
</html>
