<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta name="description" content="متتبّع عملات TikTok يدوي مع مؤقت وسجل وتصدير JSON">
<title>متتبّع العملات | Platform Suite</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}body{background:#0b141a;color:#e9edef;padding:18px 12px 34px;transition:background .2s,color .2s}body.light-theme{background:#f1f5f6;color:#18313a;color-scheme:light}.shell{max-width:680px;margin:0 auto}.topbar{display:flex;align-items:center;gap:10px;margin:0 auto 12px;padding:10px 12px;background:#202c33;border:1px solid #2a3942;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.16)}body.light-theme .topbar{background:#fff;border-color:#d3dee2;box-shadow:0 8px 24px rgba(30,60,70,.08)}.brand{flex:1}.brand b{display:block;font-size:16px}.brand span{display:block;color:#8696a0;font-size:11px;margin-top:2px}.topbar a{color:#8fd7c4;text-decoration:none;font-size:11px}.theme-btn{width:32px;height:32px;border:0;border-radius:50%;background:#2a3942;color:#e9edef;cursor:pointer;font-size:16px}.light-theme .theme-btn{background:#e4edef;color:#18313a}.coin-widget{background:#111b21;border:1px solid #2a3942;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}.light-theme .coin-widget{background:#fff;border-color:#cfdee1;box-shadow:0 10px 30px rgba(30,60,70,.1)}.coin-widget.collapsed .coin-body{display:none}.coin-head{display:flex;align-items:center;gap:9px;padding:12px 14px;background:linear-gradient(135deg,#182b32,#12221f);border-bottom:1px solid #2a3942}.light-theme .coin-head{background:linear-gradient(135deg,#effaf6,#e8f4f3);border-color:#d1e4df}.coin-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#d9a441;color:#291b04;font-size:20px}.coin-head-text{flex:1}.coin-head b{font-size:14px}.coin-head span{display:block;color:#8fa3ab;font-size:11px;margin-top:2px}.light-theme .coin-head span{color:#60757e}.coin-toggle{background:#263942;border:0;color:#d7ebe5;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px}.light-theme .coin-toggle{background:#e4edef;color:#18313a}.coin-body{padding:12px}.coin-days{display:flex;gap:6px;overflow:auto;padding:0 0 10px;scrollbar-width:none}.coin-day,.coin-chip{border:1px solid #2a4248;background:#1b2b31;color:#a9c0c5;border-radius:14px;padding:6px 11px;font:inherit;font-size:11px;white-space:nowrap;cursor:pointer}.light-theme .coin-day,.light-theme .coin-chip{background:#edf3f4;border-color:#ccdadd;color:#42616a}.coin-day.on,.coin-chip.on{background:#00a884;border-color:#00a884;color:#04241c;font-weight:700}.timer-card{background:radial-gradient(circle at 50% 0,#244039 0,#172a2d 42%,#142127 100%);border:1px solid #28554b;border-radius:14px;padding:13px;text-align:center}.light-theme .timer-card{background:radial-gradient(circle at 50% 0,#e5f7ef 0,#f1f8f7 48%,#e8f0f1 100%);border-color:#b9ddd0}.coin-state{font-size:11px;color:#a6c9bf}.light-theme .coin-state{color:#4c776b}.coin-cd{font-variant-numeric:tabular-nums;letter-spacing:1px;font-size:44px;line-height:1.15;font-weight:800;color:#effff8;margin:4px 0 8px}.light-theme .coin-cd{color:#18313a}.coin-interval{display:flex;justify-content:center;gap:5px}.coin-controls{display:flex;gap:7px;margin-top:10px}.coin-controls button{flex:1;border:0;border-radius:9px;padding:9px 5px;font:inherit;font-size:12px;cursor:pointer;background:#2a3942;color:#d8e8ec}.light-theme .coin-controls button{background:#e2ecee;color:#27434b}.coin-controls .primary{background:#00a884;color:#04241c;font-weight:700}.coin-controls .success{background:#d9a441;color:#291b04;font-weight:700}.coin-inputs{display:grid;grid-template-columns:1fr 1.45fr;gap:7px;margin-top:9px}.coin-inputs input,.coin-settings input{margin:0;padding:9px 10px;font:inherit;font-size:12px;background:#0f1a20;border:1px solid #2a3942;border-radius:8px;color:#e9edef;outline:none}.light-theme .coin-inputs input,.light-theme .coin-settings input{background:#fff;border-color:#cbdadd;color:#18313a}.coin-progress-row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:#90aaa9;margin:9px 1px 0}.coin-progress{height:6px;background:#26383a;border-radius:6px;overflow:hidden;flex:1}.coin-progress i{display:block;height:100%;background:#d9a441;border-radius:inherit;width:0;transition:width .25s}.coin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.coin-stat{background:#16242a;border:1px solid #24373e;border-radius:10px;padding:8px;text-align:center}.light-theme .coin-stat{background:#f1f7f7;border-color:#d5e2e4}.coin-stat b{display:block;color:#d9ece8;font-size:18px}.light-theme .coin-stat b{color:#24434b}.coin-stat span{color:#7e969e;font-size:10.5px}.coin-settings{display:flex;gap:9px;align-items:center;margin-top:9px;color:#8fa3ab;font-size:11px;flex-wrap:wrap}.coin-settings label{display:flex;align-items:center;gap:4px;white-space:nowrap}.coin-settings input[type=checkbox]{width:auto;accent-color:#00a884}.coin-settings input[type=number]{width:84px}.coin-list-head{display:flex;align-items:center;margin:8px 1px 4px}.coin-list-head b{font-size:12.5px;flex:1}.coin-list-head button{background:none;border:0;color:#8fd7c4;font:inherit;font-size:10.5px;cursor:pointer}.coin-backup{display:flex;gap:5px}.coin-backup button{background:#1b3032!important;border-radius:8px;padding:5px 7px}.light-theme .coin-backup button{background:#e3f1ef!important}.coin-import-input{display:none}.coin-entry{display:flex;align-items:center;gap:7px;background:#17262d;border:1px solid #22343b;border-radius:10px;padding:9px;margin-top:6px}.light-theme .coin-entry{background:#f1f7f7;border-color:#d5e2e4}.coin-entry-main{flex:1;min-width:0}.coin-entry-main b{font-size:12px;color:#d9eade}.light-theme .coin-entry-main b{color:#24434b}.coin-entry-main span{display:block;color:#81979f;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.coin-delete{width:25px;height:25px;background:#25363d;border:0;border-radius:7px;color:#aab9bd;cursor:pointer}.coin-empty{color:#7f959d;font-size:11px;line-height:1.6;padding:10px 4px;text-align:center}.coin-icon{width:14px;height:14px;display:inline-block;vertical-align:-2px;fill:currentColor;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-inline-end:4px}.coin-controls .coin-icon{width:15px;height:15px}.coin-day .coin-icon,.coin-chip .coin-icon{width:12px;height:12px}.footer{text-align:center;color:#71858d;font-size:11px;margin-top:12px}.footer a{color:#8fd7c4}.coin-controls button:focus-visible,.coin-day:focus-visible,.coin-chip:focus-visible,.theme-btn:focus-visible{outline:2px solid #00a884;outline-offset:2px}.tiktok-link{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border-radius:10px;background:#ff2d55;color:#fff!important;font-size:11px!important;font-weight:700;white-space:nowrap}.tiktok-link:hover{background:#e51f48}@media(max-width:520px){body{padding:10px 8px 24px}.coin-cd{font-size:38px}.coin-controls button{font-size:11px;padding-inline:3px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><b>Platform Suite · متتبّع العملات</b><span>تسجيل يدوي فقط — لا اتصال بحساب TikTok</span></div><a href="../?locale=ar">المنصة</a><a class="tiktok-link" href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" aria-label="فتح حسابي في TikTok">♪ TikTok</a><button class="theme-btn" id="themeToggle" aria-label="تفعيل الوضع النهاري" title="تفعيل الوضع النهاري">☀</button></header>
  <section class="coin-widget" id="coinWidget" aria-label="متتبّع العملات اليدوي">
    <div class="coin-head"><div class="coin-mark">🪙</div><div class="coin-head-text"><b>متتبّع عملات TikTok</b><span>مؤقت، سجل، وإحصاءات مع نسخ احتياطي JSON</span></div><button class="coin-toggle" id="coinToggle" aria-expanded="true" title="طي أو فتح الودجت">⌃</button></div>
    <div class="coin-body">
      <div class="coin-days" id="coinDays"></div>
      <div class="timer-card" id="coinTimerCard"><div class="coin-state" id="coinState">جاهز للتجميع اليدوي</div><div class="coin-cd" id="coinCd">20:00</div><div class="coin-interval" id="coinInterval"><button class="coin-chip" data-seconds="600" data-label="10 د">10 د</button><button class="coin-chip on" data-seconds="1200" data-label="20 د">20 د</button><button class="coin-chip" data-seconds="1800" data-label="30 د">30 د</button><button class="coin-chip" data-seconds="3600" data-label="60 د">60 د</button></div><div class="coin-controls"><button class="primary" id="coinPlay">▶ بدء الدورة</button><button id="coinReset">↻ إعادة</button><button class="success" id="coinDone">✓ تمّت</button></div><div class="coin-inputs"><input id="coinAmount" type="number" min="0" inputmode="numeric" placeholder="العملات المُجمّعة"><input id="coinNote" type="text" maxlength="60" placeholder="ملاحظة اختيارية"></div><div class="coin-progress-row"><span>هدف اليوم</span><div class="coin-progress"><i id="coinProgress"></i></div><span id="coinTargetText">0 / 1000</span></div></div>
      <div class="coin-stats"><div class="coin-stat"><b id="coinToday">0</b><span>عملات اليوم</span></div><div class="coin-stat"><b id="coinSessions">0</b><span>دورات مكتملة</span></div><div class="coin-stat"><b id="coinMinutes">0</b><span>دقائق متابعة</span></div></div>
      <div class="coin-settings"><label>الهدف <input id="coinTarget" type="number" min="0" inputmode="numeric" value="1000"></label><label><input id="coinNotify" type="checkbox"> تنبيه نهاية الدورة</label></div>
      <div class="coin-list-head"><b id="coinListTitle">السجل اليدوي</b><div class="coin-backup"><button id="coinExport" title="تصدير السجل بصيغة JSON">↓ تصدير</button><button id="coinImport" title="استيراد سجل JSON">↑ استيراد</button><input class="coin-import-input" id="coinImportInput" type="file" accept="application/json,.json"><button id="coinClear">حذف</button></div></div>
      <div id="coinList"></div>
    </div>
  </section>
  <div class="footer">بياناتك تبقى في متصفحك · <a href="../?locale=ar">العودة إلى Platform Suite</a></div>
</main>
<script>
const themeToggle=document.getElementById('themeToggle');
function applyTheme(theme){const light=theme==='light';document.body.classList.toggle('light-theme',light);themeToggle.textContent=light?'☾':'☀';themeToggle.title=light?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري';themeToggle.setAttribute('aria-label',themeToggle.title)}
const storedTheme=localStorage.getItem('azzouz.theme');applyTheme(storedTheme||(window.matchMedia?.('(prefers-color-scheme: light)').matches?'light':'dark'));themeToggle.onclick=()=>{const next=document.body.classList.contains('light-theme')?'dark':'light';localStorage.setItem('azzouz.theme',next);applyTheme(next)};
</script>
<script type="module">import { initCoinWidget } from './coin-widget.mjs?v=4'; initCoinWidget();</script>
</body>
</html>
