<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="التصوير القرآني — تجربة بصرية تعليمية محلية داخل Slaks.">
  <title>Slaks · التصوير القرآني التفاعلي</title>
  <style>
    :root{--green:#00ff88;--gold:#ffe88a;--blue:#88aaff;--bg:#020403;--panel:rgba(0,0,0,.86)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,Tahoma,sans-serif}body{overflow:hidden}canvas{display:block;width:100vw;height:100vh}.reader{position:fixed;z-index:3;inset:0 0 auto;padding:.75rem;background:var(--panel);border-bottom:1px solid var(--green);text-align:center}.reader h1{margin:0;color:var(--gold);font-size:clamp(1rem,3vw,1.5rem);line-height:1.7}.reader p{margin:.25rem auto 0;max-width:850px;color:var(--green);font-size:.75rem;line-height:1.6}.controls{position:fixed;z-index:3;inset:auto 0 0;display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;padding:.6rem;background:var(--panel);border-top:1px solid rgba(0,255,136,.25)}button,.back{border:0;border-radius:8px;padding:.5rem .75rem;background:var(--green);color:#00170b;cursor:pointer;font-weight:800;font-size:.75rem;text-decoration:none}.scene-button[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}.secondary{background:#16251c;color:#e4eee8;border:1px solid rgba(255,255,255,.18)}.status{position:fixed;z-index:2;left:.75rem;bottom:4.2rem;max-width:min(440px,calc(100vw - 1.5rem));padding:.55rem .7rem;border-right:3px solid var(--green);background:rgba(0,0,0,.7);font-size:.7rem;line-height:1.6}.status small{display:block;color:#a9bcb0;margin-top:.2rem}@media(max-width:700px){body{overflow:auto}.reader{position:relative}.controls{position:relative}.status{position:relative;left:auto;bottom:auto;margin:.6rem;max-width:none}canvas{height:58vh}}
  </style>
</head>
<body>
  <header class="reader"><h1 id="aya">﴿ والقمر قدرناه منازل حتى عاد كالعرجون القديم ﴾ يس 39</h1><p id="mind">التصوير القرآني: تجربة بصرية تعليمية تساعد على تحويل الوصف إلى مشهد ذهني.</p></header>
  <canvas id="cv" aria-label="مشهد بصري تفاعلي"></canvas>
  <section class="status" aria-live="polite"><span id="scene-name">القمر كالعرجون</span><small>هذه محاكاة فنية تعليمية وليست تفسيرًا أو إثباتًا علميًا للنص.</small></section>
  <nav class="controls" aria-label="اختيار المشهد"><a class="back secondary" href="/semver-bnf/cosmic-law.html">العودة إلى السرب</a></nav>
  <script>
    (() => {
      'use strict';
      const canvas=document.querySelector('#cv'),ctx=canvas.getContext('2d');
      const aya=document.querySelector('#aya'),mind=document.querySelector('#mind'),sceneName=document.querySelector('#scene-name');
      const scenes={
        qamar:{name:'القمر كالعرجون',aya:'﴿ والقمر قدرناه منازل حتى عاد كالعرجون القديم ﴾ يس 39',mind:'صورة هلال رقيق معوج، مع نجوم تدور حوله في مشهد هادئ.',color:'#ffe88a',draw:(x,y,t,w,h)=>{ctx.strokeStyle='#ffe88a';ctx.lineWidth=5;ctx.shadowColor='#ffe88a';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(x,y,90,.3,Math.PI*1.4);ctx.stroke();ctx.beginPath();ctx.arc(x+18,y-8,82,.4,Math.PI*1.3);ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<28;i++){const a=i/28*Math.PI*2;ctx.fillStyle=`rgba(255,255,255,${.35+.25*Math.sin(t+i)})`;ctx.fillRect(x+Math.cos(a)*150,y+Math.sin(a)*110,2,2);}}},
        jibal:{name:'الجبال تمر مر السحاب',aya:'﴿ وترى الجبال تحسبها جامدة وهي تمر مر السحاب ﴾ النمل 88',mind:'جبال تتحرك ببطء مع سحب عابرة؛ مشهد بصري عن وهم الثبات.',color:'#88aaff',draw:(x,y,t,w)=>{for(let i=0;i<5;i++){const mx=((x-300+i*120+t*.3)%(w+200))-100;ctx.fillStyle='rgba(120,140,180,.7)';ctx.beginPath();ctx.moveTo(mx,y+120);ctx.lineTo(mx+60,y-60-i*15);ctx.lineTo(mx+120,y+120);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(mx+60,y-70,60,18,0,0,Math.PI*2);ctx.fill();}}},
        jannah:{name:'أنهار الجنة',aya:'﴿ مثل الجنة التي وعد المتقون فيها أنهار من ماء غير آسن وأنهار من لبن لم يتغير طعمه ﴾ محمد 15',mind:'ألوان مائية هادئة وأشجار؛ تمثيل بصري رمزي لا يدّعي وصف الغيب.',color:'#00ff88',draw:(x,y,t,w)=>{[['#44aaff','ماء'],['#ffffff','لبن'],['#ffaa00','عسل'],['#ff88aa','شراب']].forEach((r,i)=>{const ry=y-80+i*50;ctx.strokeStyle=r[0];ctx.lineWidth=10;ctx.shadowColor=r[0];ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,ry);for(let px=0;px<w;px+=40)ctx.lineTo(px,ry+Math.sin(px*.02+t*.05+i)*8);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=r[0];ctx.font='14px serif';ctx.fillText(r[1],10,ry-12);});for(let i=0;i<12;i++){const tx=60+i*90;ctx.fillStyle='#0a5';ctx.beginPath();ctx.arc(tx,y+90,30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#654321';ctx.fillRect(tx-4,y+90,8,30);}}},
        nar:{name:'النار والزفير',aya:'﴿ إذا رأتهم من مكان بعيد سمعوا لها تغيظا وزفيرا ﴾ الفرقان 12',mind:'ألوان دافئة وحركة صاعدة؛ تمثيل فني بلا مؤثرات صوتية أو ادعاء قياس.',color:'#ff3300',draw:(x,y,t,w)=>{for(let i=0;i<70;i++){const fx=x+Math.sin(i*12.3+t*.04)*160,fy=y+((i*37+t*2)%150)-40;ctx.fillStyle=`rgba(255,${40+(i%5)*20},0,.7)`;ctx.beginPath();ctx.arc(fx,fy,3+(i%7),0,Math.PI*2);ctx.fill();}ctx.fillStyle='rgba(255,50,0,.25)';ctx.fillRect(0,y+100,w,80);}},
        nur:{name:'نور على نور',aya:'﴿ الله نور السماوات والأرض مثل نوره كمشكاة فيها مصباح المصباح في زجاجة ﴾ النور 35',mind:'مشكاة وزجاجة ومصباح في طبقات ضوئية رمزية.',color:'#ffff88',draw:(x,y,t,w,h)=>{ctx.strokeStyle='#ffff88';ctx.lineWidth=3;ctx.shadowColor='#ffff88';ctx.shadowBlur=30;ctx.strokeRect(x-80,y-90,160,200);ctx.beginPath();ctx.ellipse(x,y,45,65,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffffaa';ctx.beginPath();ctx.arc(x,y,18+Math.sin(t*.08)*3,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(x,y,0,x,y,220);g.addColorStop(0,'rgba(255,255,150,.5)');g.addColorStop(1,'rgba(255,255,150,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('نور على نور',x,y+130);}},
        sarab:{name:'السراب',aya:'﴿ والذين كفروا أعمالهم كسراب بقيعة يحسبه الظمآن ماء حتى إذا جاءه لم يجده شيئا ﴾ النور 39',mind:'صحراء وسطح لامع؛ مشهد رمزي عن التوقع والخيبة.',color:'#ffcc88',draw:(x,y,t,w,h)=>{ctx.fillStyle='#d2a24a';ctx.fillRect(0,y+40,w,h-y);ctx.fillStyle=`rgba(120,180,255,${.4+Math.sin(t*.05)*.2})`;ctx.beginPath();ctx.ellipse(x,y+60,220,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.font='14px serif';ctx.textAlign='center';ctx.fillText('يحسبه الظمآن ماء...',x,y+100);}}
      };
      let mode='qamar',t=0,last=0,reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
      function resize(){const ratio=Math.min(2,devicePixelRatio||1);canvas.width=innerWidth*ratio;canvas.height=Math.max(300,innerHeight)*ratio;canvas.style.height=Math.max(300,innerHeight)+'px';ctx.setTransform(ratio,0,0,ratio,0,0)}
      addEventListener('resize',resize,{passive:true});resize();
      const controls=document.querySelector('.controls');Object.entries(scenes).forEach(([key,data])=>{const button=document.createElement('button');button.type='button';button.className='scene-button';button.dataset.scene=key;button.textContent=data.name;button.setAttribute('aria-pressed',String(key===mode));controls.appendChild(button)});
      function showScene(key){if(!scenes[key])return;mode=key;const data=scenes[key];aya.textContent=data.aya;mind.textContent='التصوير القرآني: '+data.mind;sceneName.textContent=data.name;document.querySelectorAll('.scene-button').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.scene===key)));try{localStorage.setItem('slaks-imagery-scene',key)}catch{}}
      controls.addEventListener('click',(event)=>{const button=event.target.closest('[data-scene]');if(button)showScene(button.dataset.scene)});
      function loop(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;t+=reduceMotion?dt*.2:dt*60;ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(0,0,innerWidth,Math.max(300,innerHeight));const data=scenes[mode];data.draw(innerWidth/2,Math.max(180,innerHeight/2),t,innerWidth,Math.max(300,innerHeight));requestAnimationFrame(loop)}
      let saved='qamar';try{if(scenes[localStorage.getItem('slaks-imagery-scene')])saved=localStorage.getItem('slaks-imagery-scene')}catch{}showScene(saved);requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
