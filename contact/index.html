<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تواصل معنا وشارك تفاصيل مشروعك لنساعدك على اختيار الخطوة المناسبة.">
  <title>تواصل معنا | Practical Tools</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2rem 1rem;
    }

    .contact-card {
      width: min(52rem, 100%);
      overflow: hidden;
    }

    .contact-hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, var(--color-dark), var(--color-primary), var(--color-soft));
      padding: clamp(1.5rem, 5vw, 3.5rem);
    }

    .contact-hero::after {
      position: absolute;
      inset-block-end: -5rem;
      inset-inline-end: -3rem;
      width: 13rem;
      height: 13rem;
      border: 1.5rem solid color-mix(in srgb, var(--color-text) 10%, transparent);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .contact-form {
      padding: clamp(1.5rem, 5vw, 3rem);
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: calc(var(--radius) * 0.6);
      background: var(--color-bg);
      padding: 0.85rem 1rem;
      color: var(--color-text);
      font: inherit;
    }

    .contact-form textarea {
      min-height: 9rem;
      resize: vertical;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: var(--color-muted);
      opacity: 0.8;
    }

    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus {
      border-color: var(--color-primary);
      outline: 0;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-primary) 15%, transparent);
    }

    .contact-form [aria-invalid="true"] {
      border-color: var(--color-icon);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-icon) 13%, transparent);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.1rem;
      margin-bottom: 1.1rem;
    }

    .contact-field {
      min-width: 0;
    }

    .contact-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .required-mark {
      color: var(--color-icon);
    }

    .contact-honeypot {
      position: absolute;
      inset-inline-start: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-top: 1.4rem;
    }

    .contact-submit {
      min-height: 3rem;
      padding-inline: 1.5rem;
    }

    .contact-message {
      min-height: 1.5rem;
      margin-top: 1rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .contact-message.success {
      color: var(--color-primary);
    }

    .contact-message.error {
      color: var(--color-icon);
    }

    @media (max-width: 620px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .contact-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .contact-submit {
        width: 100%;
      }
    }

  </style>
</head>

<body class="min-h-screen">
  <main class="contact-card feature-card">
    <header class="contact-hero text-[var(--color-primary-contrast)]">
      <p class="mb-2 text-xs font-extrabold uppercase tracking-[0.16em] text-[var(--color-primary)]">لنبدأ مشروعك</p>
      <h1 class="mb-3 text-3xl font-black leading-tight sm:text-4xl">خلّينا نسمعو لفكرتك</h1>
      <p class="mb-0 max-w-2xl text-sm leading-7 opacity-90">عمّر المعلومات التالية، وغادي نتواصلو معاك باش نفهمو احتياجاتك ونقترحو عليك الحل المناسب.</p>
    </header>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="contact-honeypot" aria-hidden="true">
        <label for="contact-website">اترك هذا الحقل فارغاً</label>
        <input type="text" id="contact-website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="contact-grid">
        <div class="contact-field">
          <label class="contact-label" for="contact-name">الاسم <span class="required-mark" aria-hidden="true">*</span></label>
          <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="مثال: أحمد العلوي" required>
        </div>
        <div class="contact-field">
          <label class="contact-label" for="contact-phone">الهاتف / واتساب</label>
          <input id="contact-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="06xxxxxxxx">
        </div>
      </div>

      <div class="contact-grid">
        <div class="contact-field">
          <label class="contact-label" for="contact-email">البريد الإلكتروني</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com">
        </div>
        <div class="contact-field">
          <label class="contact-label" for="contact-type">نوع المشروع</label>
          <select id="contact-type" name="projectType">
            <option value="">اختار نوع المشروع...</option>
            <option>موقع تعريفي</option>
            <option>موقع أعمال</option>
            <option>متجر إلكتروني</option>
            <option>تطبيق ويب</option>
            <option>شي حاجة أخرى</option>
          </select>
        </div>
      </div>

      <div class="contact-field">
        <label class="contact-label" for="contact-details">تفاصيل المشروع <span class="required-mark" aria-hidden="true">*</span></label>
        <textarea id="contact-details" name="message" placeholder="شرح لينا شنو بغيتي، والهدف من المشروع..." required></textarea>
      </div>

      <div class="contact-actions">
        <button class="contact-submit btn-primary" type="submit">أرسل الطلب</button>
        <span class="text-xs text-[var(--color-muted)]">الحقول التي تحمل علامة * إلزامية</span>
      </div>
      <p class="contact-message" id="contact-status" role="status" aria-live="polite"></p>
      <p class="mb-0 mt-4 border-t border-[var(--color-border)] pt-4 text-xs leading-6 text-[var(--color-muted)]">لا تدرج كلمات مرور أو مفاتيح API أو معلومات حساسة ضمن تفاصيل المشروع.</p>
    </form>
  </main>

  <script>
    const contactForm = document.querySelector('#contact-form');
    const contactStatus = document.querySelector('#contact-status');
    const STORAGE_KEY = 'practical-tools-leads-v1';

    function showContactStatus(message, type = '') {
      contactStatus.textContent = message;
      contactStatus.className = `contact-message ${type}`.trim();
    }

    function getLeads() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function saveLead(lead) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([lead, ...getLeads()]));
    }

    function markInvalid(field, invalid) {
      field.setAttribute('aria-invalid', String(invalid));
    }

    function isValidPhone(value) {
      return !value || /^[+0-9\s()-]{8,}$/.test(value);
    }

    function isValidEmail(value) {
      return !value || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    contactForm.addEventListener('submit', (event) => {
      event.preventDefault();
      showContactStatus();
      const fields = {
        name: document.querySelector('#contact-name'),
        phone: document.querySelector('#contact-phone'),
        email: document.querySelector('#contact-email'),
        projectType: document.querySelector('#contact-type'),
        message: document.querySelector('#contact-details'),
        website: document.querySelector('#contact-website')
      };
      const values = Object.fromEntries(
        Object.entries(fields).map(([key, field]) => [key, field.value.trim()])
      );
      if (values.website) return;
      const invalid = {
        name: !values.name,
        message: !values.message,
        phone: !isValidPhone(values.phone),
        email: !isValidEmail(values.email)
      };
      Object.entries(invalid).forEach(([key, state]) => markInvalid(fields[key], state));
      if (invalid.name || invalid.message) {
        showContactStatus('عمّر الاسم وتفاصيل المشروع على الأقل.', 'error');
        (invalid.name ? fields.name : fields.message).focus();
        return;
      }
      if (invalid.phone) {
        showContactStatus('رقم الهاتف ماشي صحيح.', 'error');
        fields.phone.focus();
        return;
      }
      if (invalid.email) {
        showContactStatus('الإيميل ماشي صحيح.', 'error');
        fields.email.focus();
        return;
      }
      saveLead({
        id: crypto.randomUUID(),
        createdAt: new Date().toISOString(),
        name: values.name,
        phone: values.phone,
        email: values.email,
        projectType: values.projectType,
        message: values.message
      });
      showContactStatus('✅ تخزّن الطلب بنجاح داخل هذا المتصفح.', 'success');
      contactForm.reset();
      Object.values(fields).forEach((field) => field.removeAttribute('aria-invalid'));
    });
  </script>
  <script src="/language.js"></script>
</body>

</html>
