name: Slaks site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML links and IDs
        run: python3 scripts/check_site.py
      - name: Validate fixed OneCompiler integration contract
        run: python3 scripts/check_onecompiler_contract.py
