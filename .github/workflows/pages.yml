name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for Quran analysis
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements-simulation.txt
      - name: Install pinned scientific stack
        run: python -m pip install --requirement analysis/requirements-simulation.txt
      - name: Regenerate Quran report and node metrics
        run: |
          python analysis/run_reproducible_pipeline.py --samples 200000 --seed 12345
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("analysis/quran_analysis_report.json").read_text(encoding="utf-8"))
          assert report["metadata"]["random_seed"] == 12345
          assert report["metadata"]["simulations_B"] == 200000
          assert "kruskal_wallis" in report and len(report["kruskal_wallis"]) == 4
          print("Quran report and Kruskal-Wallis checks: OK")
          PY
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install CSS compiler
        run: pnpm install --frozen-lockfile
      - name: Build local Tailwind CSS
        run: pnpm build:css
      - name: Remove build dependencies from Pages artifact
        run: rm -rf node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
