name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker-oauth-proxy.js"
      - "wrangler.toml"
      - "satellite/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker JavaScript
        run: node --check cloudflare-worker-oauth-proxy.js

      - name: Validate site contracts
        run: python3 scripts/check_site.py

      - name: Verify deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Print deployment metadata
        if: success()
        run: |
          echo "Worker github-oauth-proxy deployed successfully."
          echo "The API token was provided through GitHub Secrets and was not printed."
