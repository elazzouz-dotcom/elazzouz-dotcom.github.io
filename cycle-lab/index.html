<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Azzouz Full Cycle Lab — دورة تكامل مغلقة بين HTML وSecurity والآيات والتوازن وCSS وJavaScript.">
  <title>Azzouz Full Cycle Lab · كل في فلك يسبحون</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Consolas,"Courier New",monospace;overflow:hidden}#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.92);padding:9px;text-align:center;z-index:10;border-bottom:1px solid #00ff88}#cycle{font-size:13px;color:#00ff88;line-height:1.8;direction:rtl}#layers{color:#b9ffd9;font-size:11px;max-width:980px;margin:3px auto}#alert{display:inline-block;margin:4px auto 0;border:1px solid #00ff88;border-radius:6px;padding:3px 8px;color:#00ff88;font-size:11px}#alert.broken{border-color:#ff4d6d;color:#ff879b;background:rgba(120,0,30,.25)}#notify{margin-inline-start:6px;background:#00ff88;color:#00150b;border:0;border-radius:5px;padding:3px 7px;font:inherit;font-size:10px;cursor:pointer}canvas{width:100vw;height:100vh;display:block}#log{position:fixed;bottom:0;left:0;right:0;height:76px;overflow:auto;background:rgba(0,0,0,.9);font-size:11px;padding:5px;z-index:5}.back{position:fixed;top:10px;inset-inline-start:10px;color:#00ff88;text-decoration:none;border:1px solid #00ff88;border-radius:6px;padding:4px 8px;font-size:11px;z-index:12}@media(max-width:700px){#cycle{font-size:11px}.back{top:auto;bottom:84px}}
  </style>
</head>
<body>
  <a class="back" href="/bridge-lab/">مختبر الجسر</a>
  <header id="hud">
    <div style="font-size:16px">Azzouz Full Cycle Lab · الدائرة الكاملة</div>
    <div id="cycle">استكشاف → حماية → نور → ميزان → بناء → فحص → استكشاف</div>
    <div id="layers">HTML يكتشف · Security يحمي · الآيات تمنح الروح · التوازن يضبط · CSS يبني · JavaScript يفحص</div>
    <div>الدورات: <b id="rounds" style="color:#ffaa00">0</b> · التكامل: <b id="integ" style="color:#00ff88">0%</b> · الطاقة: <b id="energy" style="color:#ffff88">0</b></div>
    <div id="alert" role="status" aria-live="assertive">الجسر سليم · مراقبة الحلقات مفعّلة <button id="notify" type="button">تفعيل تنبيهات الجهاز</button></div>
  </header>
  <canvas id="cv" aria-label="محاكاة الدورة المغلقة"></canvas>
  <div id="log" aria-live="polite"></div>
  <script>
    const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
    function resize(){cv.width=innerWidth;cv.height=innerHeight}resize();addEventListener('resize',resize);
    function log(text){const item=document.createElement('div');item.textContent=`[${new Date().toLocaleTimeString('ar')}] ${text}`;const output=document.getElementById('log');output.appendChild(item);while(output.children.length>40)output.removeChild(output.firstChild);output.scrollTop=output.scrollHeight}
    let lastBreakKey='';
    function enableNotifications(){if(!('Notification' in window)){log('هذا المتصفح لا يدعم تنبيهات الجهاز.');return}Notification.requestPermission().then((permission)=>{document.getElementById('notify').textContent=permission==='granted'?'تنبيهات الجهاز مفعّلة':'السماح بالتنبيهات';log(permission==='granted'?'تم تفعيل تنبيهات انكسار الجسر.':'لم يُمنح إذن تنبيهات الجهاز.')}).catch(()=>log('تعذر طلب إذن التنبيهات.'))}
    document.getElementById('notify').addEventListener('click',enableNotifications);
    function sendSystemAlert(title,body){if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,tag:'azzouz-bridge-integrity'})}
    function monitorIntegrity(integration){
      const missing=ORDER.filter((role)=>!colony.some((insect)=>insect.role===role));
      const reason=missing.length?`انكسرت حلقة ${missing.map((role)=>`${role}/${CIRCLE[role].layer}`).join('، ')}: لا توجد حشرة تمثلها.`:integration<75?`انخفض التكامل إلى ${integration.toFixed(0)}%، والحد الآمن 75%.`:
        '';
      const alert=document.getElementById('alert');
      if(reason){const key=missing.join('|')||`integration-${Math.floor(integration/5)}`;alert.classList.add('broken');alert.firstChild.textContent=`تنبيه: ${reason} `;if(key!==lastBreakKey){lastBreakKey=key;log(`تنبيه فوري: ${reason}`);sendSystemAlert('Azzouz · انكسار حلقة الجسر',reason)}}
      else if(lastBreakKey){lastBreakKey='';alert.classList.remove('broken');alert.firstChild.textContent='الجسر عاد سليمًا · كل الحلقات متصلة ';log('تعافٍ: عادت دورة التكامل إلى الحالة السليمة.');sendSystemAlert('Azzouz · تعافي الجسر','عادت كل حلقات الدورة المغلقة للعمل.')}
    }
    const CIRCLE={
      'استكشاف':{needs:'حماية',gives:'معلومة',layer:'HTML',color:'#00ff88',angle:0},
      'حماية':{needs:'نور',gives:'أمان',layer:'Security',color:'#4488ff',angle:60},
      'نور':{needs:'ميزان',gives:'طاقة',layer:'الآيات',color:'#ffff88',angle:120},
      'ميزان':{needs:'بناء',gives:'عدل',layer:'التوازن',color:'#ff44ff',angle:180},
      'بناء':{needs:'فحص',gives:'جسر',layer:'CSS',color:'#00ccff',angle:240},
      'فحص':{needs:'استكشاف',gives:'حقيقة',layer:'JavaScript',color:'#ffaa00',angle:300}
    };
    const ORDER=Object.keys(CIRCLE);let colony=[],nextId=0,rounds=0,totalEnergy=0;
    class CircleInsect{
      constructor(role,parent=null){if(!role){const count=Object.fromEntries(ORDER.map(r=>[r,0]));colony.forEach(i=>count[i.role]++);role=ORDER.reduce((a,b)=>count[a]<count[b]?a:b)}this.role=role;this.id=++nextId;this.gen=parent?parent.gen+1:1;this.energy=100+Math.random()*20;this.eff=1+Math.random()*.3;const angle=CIRCLE[role].angle*Math.PI/180+(Math.random()-.5)*.5;const radius=150+Math.random()*40;this.x=cv.width/2+Math.cos(angle)*radius;this.y=cv.height/2+Math.sin(angle)*radius;this.vx=(Math.random()-.5);this.vy=(Math.random()-.5);this.partner=null;this.gave=false;this.received=false}
      findComplement(){const need=CIRCLE[this.role].needs;return colony.filter(i=>i!==this&&i.role===need&&!i.partner).sort((a,b)=>Math.hypot(a.x-this.x,a.y-this.y)-Math.hypot(b.x-this.x,b.y-this.y))[0]||null}
      update(){const dx=this.x-cv.width/2,dy=this.y-cv.height/2,dist=Math.hypot(dx,dy)||1;this.vx+=(-dy/dist)*.02;this.vy+=(dx/dist)*.02;this.x+=this.vx;this.y+=this.vy;this.vx*=.99;this.vy*=.99;if(!this.partner){const complement=this.findComplement();if(complement){this.partner=complement;complement.partner=this;const mine=CIRCLE[this.role],his=CIRCLE[complement.role];this.energy+=15;complement.energy+=15;this.gave=true;complement.received=true;log(`${this.role}/${mine.layer} → ${complement.role}/${his.layer}: ${mine.gives} + ${his.gives} · طاقة +15`);if(colony.length<300&&Math.random()<.6){colony.push(new CircleInsect(mine.needs,this));const present=new Set(colony.map(i=>i.role));if(present.size===6){rounds++;colony.forEach(i=>i.energy+=5);log(`دورة كاملة #${rounds} · الأدوار الستة اجتمعت · الدائرة مغلقة`)}}}}if(this.partner){this.x+=(this.partner.x-this.x)*.015;this.y+=(this.partner.y-this.y)*.015;if(Math.hypot(this.partner.x-this.x,this.partner.y-this.y)<12&&Math.random()<.02){this.partner.partner=null;this.partner=null}}this.energy-=.08;if(this.energy<=0){if(Math.random()<.4&&colony.length<300)colony.push(new CircleInsect(this.role,this));return false}return true}
    }
    for(let i=0;i<57;i++)colony.push(new CircleInsect(ORDER[i%6]));log('الدائرة الكاملة بدأت · 57 حشرة · كل طبقة تحتاج الطبقة التالية');
    function loop(){colony=colony.filter(i=>i.update());while(colony.length<36)colony.push(new CircleInsect());const paired=colony.filter(i=>i.partner).length,integration=paired/colony.length*100;totalEnergy=colony.reduce((sum,i)=>sum+i.energy,0);document.getElementById('rounds').textContent=rounds;document.getElementById('integ').textContent=integration.toFixed(0)+'%';document.getElementById('energy').textContent=totalEnergy.toFixed(0);monitorIntegrity(integration)}
    function draw(){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,cv.width,cv.height);const cx=cv.width/2,cy=cv.height/2;ctx.strokeStyle='rgba(0,255,136,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,170,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,120,0,Math.PI*2);ctx.stroke();ORDER.forEach((role,i)=>{const next=ORDER[(i+1)%6],a1=CIRCLE[role].angle*Math.PI/180,a2=CIRCLE[next].angle*Math.PI/180,x1=cx+Math.cos(a1)*170,y1=cy+Math.sin(a1)*170,x2=cx+Math.cos(a2)*170,y2=cy+Math.sin(a2)*170;ctx.strokeStyle=CIRCLE[role].color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.fillStyle=CIRCLE[role].color;ctx.font='bold 13px serif';ctx.textAlign='center';ctx.fillText(role,cx+Math.cos(a1)*200,cy+Math.sin(a1)*200);ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='10px serif';ctx.fillText(`${CIRCLE[role].layer} · يحتاج ${CIRCLE[role].needs}`,cx+Math.cos(a1)*200,cy+Math.sin(a1)*200+14)});ctx.fillStyle='#fff';ctx.font='bold 24px serif';ctx.fillText('١',cx,cy+8);ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='10px serif';ctx.fillText('التوحيد',cx,cy+26);colony.forEach(i=>{if(i.partner){ctx.strokeStyle='rgba(255,170,0,.5)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(i.x,i.y);ctx.lineTo(i.partner.x,i.partner.y);ctx.stroke()}const c=CIRCLE[i.role].color;ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=i.partner?12:5;ctx.beginPath();ctx.arc(i.x,i.y,3+i.eff,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0})}
    setInterval(loop,40);setInterval(draw,16);
  </script>
</body>
</html>
